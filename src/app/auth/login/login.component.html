<div class="auth-container">
  <mat-card class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your account</p>
    </div>
    
    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" required>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" name="password" [(ngModel)]="password" required>
          <mat-icon matSuffix class="cursor-pointer" (click)="hidePassword = !hidePassword">
            {{hidePassword ? 'visibility_off' : 'visibility'}}
          </mat-icon>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" class="login-button" type="submit" [disabled]="!loginForm.form.valid">
            Sign In
          </button>
          
          <div class="register-prompt">
            <span>Don't have an account?</span>
            <a [routerLink]="['/auth/register']" routerLinkActive="active">Create one now</a>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
