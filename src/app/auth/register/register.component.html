<div class="auth-container">
  <mat-card class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Join Shaurya to connect with your community</p>
    </div>
    
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.touched">{{getEmailError()}}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <mat-icon matSuffix class="cursor-pointer" (click)="hidePassword = !hidePassword">
            {{hidePassword ? 'visibility_off' : 'visibility'}}
          </mat-icon>
          <mat-error *ngIf="registerForm.get('password')?.touched">{{getPasswordError()}}</mat-error>
        </mat-form-field>

        <div class="password-hints" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors">
          <ul class="requirements-list">
            <li [class.satisfied]="!passwordErrors['special']">Special character required</li>
            <li [class.satisfied]="!passwordErrors['uppercase']">Uppercase letter required</li>
            <li [class.satisfied]="registerForm.get('password')?.value?.length >= 6">Minimum 6 characters</li>
          </ul>
        </div>

        <div class="form-actions">
          <button mat-raised-button color="primary" class="register-button" type="submit" [disabled]="registerForm.invalid">
            Create Account
          </button>
          
          <div class="login-prompt">
            <span>Already have an account?</span>
            <a [routerLink]="['/auth/login']" routerLinkActive="active">Sign in</a>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
