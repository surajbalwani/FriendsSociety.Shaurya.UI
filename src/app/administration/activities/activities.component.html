<h2>Activities</h2>

<!-- Toggle Form Button - Right aligned -->
<div style="margin-bottom: 20px; text-align: right;">
  <button 
    type="button" 
    style="background-color: #7c3aed; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;"
    (click)="toggleForm()"
    [disabled]="isSubmitting">
    {{ showForm ? 'Hide Form' : 'Add New Activity' }}
  </button>
</div>

<!-- Add New Activity Form -->
<div *ngIf="showForm" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9;">
  <h3>Add New Activity</h3>
  <form [formGroup]="activityForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label for="name" style="display: block; margin-bottom: 5px; font-weight: bold;">Name *</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
        placeholder="Enter activity name">
      <div *ngIf="activityForm.get('name')?.invalid && activityForm.get('name')?.touched" style="color: red; font-size: 12px; margin-top: 5px;">
        <span *ngIf="activityForm.get('name')?.errors?.['required']">Name is required</span>
        <span *ngIf="activityForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters</span>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label for="rules" style="display: block; margin-bottom: 5px; font-weight: bold;">Rules *</label>
      <textarea 
        id="rules" 
        formControlName="rules" 
        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
        rows="3"
        placeholder="Enter activity rules"></textarea>
      <div *ngIf="activityForm.get('rules')?.invalid && activityForm.get('rules')?.touched" style="color: red; font-size: 12px; margin-top: 5px;">
        <span *ngIf="activityForm.get('rules')?.errors?.['required']">Rules are required</span>
        <span *ngIf="activityForm.get('rules')?.errors?.['minlength']">Rules must be at least 5 characters</span>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button 
        type="submit" 
        style="background-color: #7c3aed; color: white; padding: 8px 16px; border: none; border-radius: 4px; margin-right: 10px; cursor: pointer;"
        [disabled]="activityForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Create Activity' }}
      </button>
      <button 
        type="button" 
        style="background-color: #6c757d; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;"
        (click)="toggleForm()"
        [disabled]="isSubmitting">
        Cancel
      </button>
    </div>
  </form>
</div>

<!-- Success/Error Messages -->
<div *ngIf="message" style="padding: 10px; margin-bottom: 15px; border-radius: 4px;" 
     [style.background-color]="messageType === 'success' ? '#d4edda' : '#f8d7da'"
     [style.color]="messageType === 'success' ? '#155724' : '#721c24'"
     [style.border]="messageType === 'success' ? '1px solid #c3e6cb' : '1px solid #f5c6cb'">
  {{ message }}
</div>

<!-- Activities Table -->
<table>
  <thead>
    <tr>
      <th>Activity ID</th>
      <th>Name</th>
      <th>Rules</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let activity of activities; trackBy: trackByActivityID">
      <td>{{ activity.activityID }}</td>
      <td>{{ activity.name }}</td>
      <td>{{ activity.rules }}</td>
      <td>{{ activity.isDeleted ? 'Deleted' : 'Active' }}</td>
    </tr>
  </tbody>
</table>
